{{- if .Values.upgrade.enabled }}
{{- $fullname := include "otc.fullname" . }}
{{- $sa := printf "%s-controller-manager" $fullname }}
{{- $ns := .Release.Namespace }}
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ $sa }}-talos-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
spec:
  roles:
  - os:admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-manager-role
  labels:
    {{- include "otc.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - talos.openresearch.com
  resources:
  - machineconfigplans
  verbs:
  - get
- apiGroups:
  - talos.openresearch.com
  resources:
  - upgradeplans
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - talos.openresearch.com
  resources:
  - upgradeplans/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-manager-rolebinding
  labels:
    {{- include "otc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-manager-role
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-manager-rolebinding
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election-role
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election-rolebinding
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ $ns }}
{{- if .Values.metrics.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-metrics-auth-rolebinding
  labels:
    {{- include "otc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ $ns }}
---
{{ include "otc.metricsService" (dict "root" . "name" (printf "%s-controller-manager-metrics-service" $fullname) "selector" (printf "%s\ncontrol-plane: controller-manager" (include "otc.selectorLabels" .))) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "otc.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "otc.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "otc.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      affinity:
        {{- include "otc.affinity" . | nindent 8 }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:8443
        {{- end }}
        - --controllers=upgrade
        - --leader-elect
        - --health-probe-bind-address=:8081
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- range $env, $key := dict "S3_ENDPOINT" "endpoint" "S3_BUCKET" "bucket" "S3_ACCESS_KEY" "accessKey" "S3_SECRET_KEY" "secretKey" "S3_REGION" "region" "S3_PREFIX" "prefix" }}
        - name: {{ $env }}
          valueFrom:
            secretKeyRef:
              key: {{ $key }}
              name: {{ $.Values.upgrade.etcdSnapshotSecret }}
              optional: true
        {{- end }}
        - name: TALOS_RELEASE_URL
          value: {{ .Values.upgrade.releaseFeeds.talos }}
        - name: KUBERNETES_RELEASE_URL
          value: {{ .Values.upgrade.releaseFeeds.kubernetes }}
        - name: INSTALLER_IMAGE_BASE
          value: {{ .Values.upgrade.installerImageBase }}
        resources:
          {{- toYaml .Values.upgrade.resources | nindent 10 }}
        {{- include "otc.containerCommon" . | nindent 8 }}
      {{- include "otc.podCommon" (dict "root" . "sa" $sa "secret" (printf "%s-talos-secrets" $sa)) | nindent 6 }}
{{- end }}
