---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - talos.openresearch.com
  resources:
  - machineconfigplans
  verbs:
  - get
- apiGroups:
  - talos.openresearch.com
  resources:
  - upgradeplans
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - talos.openresearch.com
  resources:
  - upgradeplans/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-role
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
