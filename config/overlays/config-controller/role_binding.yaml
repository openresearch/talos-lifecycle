---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: config-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-lifecycle-config-manager-role
subjects:
  - kind: ServiceAccount
    name: talos-lifecycle-config-manager
    namespace: talos-lifecycle-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-secrets-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-lifecycle-config-secrets-role
subjects:
  - kind: ServiceAccount
    name: talos-lifecycle-config-manager
    namespace: talos-lifecycle-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: config-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-lifecycle-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: talos-lifecycle-config-manager
    namespace: talos-lifecycle-system
