---
# its own lease: a shared one would let only one Deployment run
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-leader-election-role
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-lifecycle-config-leader-election-role
subjects:
  - kind: ServiceAccount
    name: talos-lifecycle-config-manager
    namespace: talos-lifecycle-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-controller
  labels:
    app.kubernetes.io/name: talos-lifecycle
    app.kubernetes.io/component: config-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-lifecycle
      app.kubernetes.io/component: config-controller
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: talos-lifecycle
        app.kubernetes.io/component: config-controller
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: talos-lifecycle
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --controllers=config
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          command:
            - /manager
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - mountPath: /var/run/secrets/talos.dev
              name: talos-secrets
              readOnly: true
            - mountPath: /tmp
              name: tmp
      serviceAccountName: config-manager
      # the descheduler never evicts critical pods
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 10
      volumes:
        - name: talos-secrets
          secret:
            secretName: talos-lifecycle-config-manager-talos-secrets
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
