apiVersion: v1
kind: Namespace
metadata:
    labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: talos-lifecycle
        control-plane: controller-manager
    name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: talos-lifecycle
    control-plane: controller-manager
  name: controller-manager
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-lifecycle
      control-plane: controller-manager
  strategy: {}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: talos-lifecycle
        control-plane: controller-manager
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: talos-lifecycle
              topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --controllers=upgrade
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # optional, so the pod starts before the Secret exists
        - name: S3_ENDPOINT
          valueFrom: {secretKeyRef: {name: talos-lifecycle-s3, key: endpoint, optional: true}}
        - name: S3_BUCKET
          valueFrom: {secretKeyRef: {name: talos-lifecycle-s3, key: bucket, optional: true}}
        - name: S3_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: talos-lifecycle-s3, key: accessKey, optional: true}}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: talos-lifecycle-s3, key: secretKey, optional: true}}
        - name: S3_REGION
          valueFrom: {secretKeyRef: {name: talos-lifecycle-s3, key: region, optional: true}}
        - name: S3_PREFIX
          valueFrom: {secretKeyRef: {name: talos-lifecycle-s3, key: prefix, optional: true}}
        - name: TALOS_RELEASE_URL
          value: "https://api.github.com/repos/siderolabs/talos/releases"
        - name: KUBERNETES_RELEASE_URL
          value: "https://api.github.com/repos/kubernetes/kubernetes/releases"
        - name: INSTALLER_IMAGE_BASE
          value: "factory.talos.dev/installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
        image: controller:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            # headroom for streaming etcd snapshots
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/run/secrets/talos.dev
          name: talos-secrets
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: controller-manager
      # the descheduler never evicts critical pods
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 10
      volumes:
      - name: talos-secrets
        secret:
          secretName: talos-lifecycle-controller-manager-talos-secrets
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
status: {}
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
    name: controller-manager-talos-secrets
    namespace: system
spec:
    roles:
        - os:admin
